<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>OpenMind – Agent Reasoning Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a14; color: #e0e0e0; font-family: 'SF Mono', 'Fira Code', monospace; padding: 20px; font-size: 13px; }
        h1 { color: #8b5cf6; font-size: 18px; margin-bottom: 16px; }
        .section { margin-bottom: 20px; padding: 16px; background: rgba(20,20,40,0.8); border: 1px solid rgba(100,100,200,0.2); border-radius: 8px; }
        .section h2 { color: #6366f1; font-size: 14px; margin-bottom: 10px; }
        .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        label { min-width: 80px; color: #94a3b8; font-size: 11px; }
        input, select { background: #111122; border: 1px solid rgba(100,100,200,0.3); color: #e0e0e0; padding: 6px 10px; border-radius: 4px; font-family: inherit; font-size: 12px; }
        input { flex: 1; }
        button { padding: 8px 16px; border: 1px solid rgba(139,92,246,0.4); border-radius: 6px; background: rgba(139,92,246,0.2); color: #e0e0e0; cursor: pointer; font-family: inherit; font-size: 12px; }
        button:hover { background: rgba(139,92,246,0.4); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-danger { border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.15); color: #ef4444; }
        #log { background: #080812; border: 1px solid rgba(100,100,200,0.2); border-radius: 6px; padding: 12px; max-height: 500px; overflow-y: auto; font-size: 11px; line-height: 1.6; }
        .log-entry { padding: 2px 0; border-bottom: 1px solid rgba(100,100,200,0.1); }
        .log-action { color: #22c55e; }
        .log-thought { color: #6366f1; }
        .log-error { color: #ef4444; }
        .log-success { color: #4ade80; }
        .log-info { color: #94a3b8; }
        .status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; }
        .status-pass { background: rgba(34,197,94,0.2); color: #22c55e; }
        .status-fail { background: rgba(239,68,68,0.2); color: #ef4444; }
        .status-pending { background: rgba(250,204,21,0.2); color: #facc15; }
        .results { margin-top: 10px; }
        .result-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(100,100,200,0.1); }
        #viewport3d { width: 100%; height: 300px; background: #111118; border-radius: 6px; margin-bottom: 12px; overflow: hidden; }
    </style>
</head>
<body>
    <h1>Agent Reasoning Test</h1>

    <div class="section">
        <h2>1. WASM Engine</h2>
        <div id="viewport3d"></div>
        <button id="initBtn">Initialize Engine</button>
        <span id="engineStatus" class="status status-pending">Not initialized</span>
    </div>

    <div class="section">
        <h2>2. LLM Configuration</h2>
        <div class="row"><label>Provider</label><select id="provider"><option value="groq">Groq</option><option value="openai">OpenAI</option><option value="anthropic">Anthropic</option></select></div>
        <div class="row"><label>API Key</label><input type="password" id="apiKey" placeholder="sk-..."></div>
        <div class="row"><label>Model</label><input type="text" id="model" value="llama-3.3-70b-versatile"></div>
        <button id="testLlmBtn">Test LLM</button>
        <span id="llmStatus" class="status status-pending">Not tested</span>
    </div>

    <div class="section">
        <h2>3. Agent Spawn</h2>
        <div class="row"><label>Name</label><input type="text" id="agentName" value="Builder"></div>
        <div class="row"><label>Role</label><select id="agentRole"><option value="builder">Builder</option><option value="explorer">Explorer</option></select></div>
        <div class="row"><label>Goal</label><select id="agentGoal"><option value="build_house">Build a House</option><option value="build_tower">Build a Tower</option><option value="custom">Custom</option></select></div>
        <div class="row"><label>Custom Goal</label><input type="text" id="customGoal" placeholder="e.g. Build a 5x5 stone platform"></div>
        <button id="spawnBtn">Spawn & Start Agent</button>
        <button id="stopBtn" class="btn-danger">Stop Agent</button>
    </div>

    <div class="section">
        <h2>4. Log</h2>
        <div id="log"></div>
    </div>

    <div class="section">
        <h2>5. Test Results</h2>
        <div class="results" id="results"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="openmind.js"></script>
    <script src="utils.js"></script>
    <script src="llm_client.js?v=3"></script>
    <script src="agent_prompt_builder.js"></script>
    <script src="action_parser.js"></script>
    <script src="agent_think.js"></script>
    <script src="agent_config.js"></script>
    <script src="agent_management.js"></script>
    <script>
    (function() {
        const logEl = document.getElementById('log');
        const resultsEl = document.getElementById('results');
        let engine = null, llm = null, manager = null, renderer = null;
        let testResults = [];

        function log(msg, type = 'info') {
            const d = document.createElement('div');
            d.className = 'log-entry log-' + type;
            d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logEl.appendChild(d);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function result(name, pass) {
            testResults.push({ name, pass });
            resultsEl.innerHTML = '';
            for (const r of testResults) {
                const d = document.createElement('div');
                d.className = 'result-item';
                d.innerHTML = `<span>${r.name}</span><span class="status ${r.pass ? 'status-pass' : 'status-fail'}">${r.pass ? 'PASS' : 'FAIL'}</span>`;
                resultsEl.appendChild(d);
            }
        }

        document.getElementById('initBtn').addEventListener('click', async () => {
            log('Initializing WASM engine...');
            try {
                engine = new EngineConnection();
                const ok = await engine.load();
                if (ok) {
                    engine.initWorld();
                    document.getElementById('engineStatus').textContent = 'Connected';
                    document.getElementById('engineStatus').className = 'status status-pass';
                    log('WASM engine ready', 'success');
                    result('WASM Engine Init', true);

                    try {
                        renderer = new VoxelRenderer('viewport3d');
                        renderer.start(engine);
                        log('Renderer started', 'success');
                    } catch (e) {
                        log('Renderer failed (non-critical): ' + e.message, 'error');
                    }
                } else {
                    log('WASM load failed', 'error');
                    result('WASM Engine Init', false);
                }
            } catch (e) {
                log('Init error: ' + e.message, 'error');
                result('WASM Engine Init', false);
            }
        });

        document.getElementById('testLlmBtn').addEventListener('click', async () => {
            log('Testing LLM connection...');
            llm = new LLMClient();
            llm.engine = engine;
            llm.setConfig(
                document.getElementById('provider').value,
                document.getElementById('apiKey').value,
                '',
                document.getElementById('model').value
            );
            try {
                const result = await llm.generate('Place a single stone block at 5,2,5');
                if (result.success) {
                    document.getElementById('llmStatus').textContent = 'Connected';
                    document.getElementById('llmStatus').className = 'status status-pass';
                    log('LLM connected, tools used: ' + (result.toolsUsed || []).join(', '), 'success');
                    testResults.push({ name: 'LLM Connection', pass: true });
                    result('LLM Connection', true);
                } else {
                    log('LLM error: ' + result.error, 'error');
                    testResults.push({ name: 'LLM Connection', pass: false });
                    result('LLM Connection', false);
                }
            } catch (e) {
                log('LLM test error: ' + e.message, 'error');
                result('LLM Connection', false);
            }
        });

        document.getElementById('spawnBtn').addEventListener('click', async () => {
            if (!llm || !engine) { log('Initialize engine and LLM first', 'error'); return; }
            log('Spawning agent...');
            manager = new AgentManager();
            manager.setLLM(llm);
            manager.setEngine(engine);
            if (renderer) manager.setRenderer(renderer);
            await manager.init();

            manager.onAgentMessage = (id, msg) => log(`[${id}] ${msg}`, 'info');
            manager.onAgentUpdate = () => log('Agent state updated', 'info');

            const cfg = new AgentConfig();
            cfg.apply({
                name: document.getElementById('agentName').value,
                role: document.getElementById('agentRole').value,
                goalPreset: document.getElementById('agentGoal').value,
                customGoal: document.getElementById('customGoal').value
            });
            const agent = manager.spawn(cfg);
            log(`Spawned: ${agent.name} (${agent.role}) Goal: ${agent.currentGoal?.description}`, 'success');
            result('Agent Spawn', true);

            const started = manager.startAgent(agent.id);
            if (started) {
                log('Agent thinking loop started', 'success');
                result('Agent Think Loop', true);
            } else {
                log('Failed to start agent', 'error');
                result('Agent Think Loop', false);
            }
        });

        document.getElementById('stopBtn').addEventListener('click', () => {
            if (manager) {
                manager.stopAll();
                log('All agents stopped', 'info');
            }
        });

        log('Test ready. Step 1: Initialize engine. Step 2: Configure LLM. Step 3: Spawn agent.', 'info');
    })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OpenMind – Mobile Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', monospace; background: #0a0a1a; color: #e0e0e0; overflow-x: hidden; }
        #viewport3d { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        #testPanel {
            position: fixed; top: 10px; left: 10px; z-index: 1000;
            background: rgba(10,10,30,0.92); border: 1px solid rgba(100,100,200,0.3);
            border-radius: 12px; padding: 16px; width: calc(100% - 20px); max-height: 80vh;
            overflow-y: auto; backdrop-filter: blur(12px); font-size: 13px;
        }
        #testPanel h2 { color: #8b5cf6; margin-bottom: 12px; font-size: 16px; }
        .tg { margin-bottom: 10px; border-bottom: 1px solid rgba(100,100,200,0.2); padding-bottom: 8px; }
        .tg h3 { color: #60a5fa; font-size: 11px; margin-bottom: 6px; text-transform: uppercase; }
        .tr { display: flex; align-items: center; gap: 6px; margin: 3px 0; flex-wrap: wrap; }
        .tb {
            padding: 8px 14px; border: 1px solid rgba(100,100,200,0.4); border-radius: 8px;
            background: rgba(30,30,60,0.8); color: #e0e0e0; cursor: pointer; font-size: 12px;
            min-height: 44px; min-width: 44px;
        }
        .tb:hover { background: rgba(60,60,120,0.8); border-color: #8b5cf6; }
        .r { font-size: 10px; padding: 3px 8px; border-radius: 4px; min-height: 22px; }
        .pass { background: rgba(34,197,94,0.2); color: #22c55e; }
        .fail { background: rgba(239,68,68,0.2); color: #ef4444; }
        .pending { background: rgba(234,179,8,0.2); color: #eab308; }
        #log { margin-top: 8px; max-height: 150px; overflow-y: auto; font-size: 10px; color: #94a3b8; }
        #log div { padding: 2px 0; border-bottom: 1px solid rgba(100,100,200,0.1); }
        .ok { color: #22c55e; } .err { color: #ef4444; } .info { color: #60a5fa; }
        @media (max-width: 480px) {
            #testPanel { padding: 10px; width: calc(100% - 12px); font-size: 12px; }
            .tb { padding: 10px 16px; font-size: 13px; min-height: 48px; }
        }
    </style>
</head>
<body>
    <div id="viewport3d"></div>

    <div id="testPanel">
        <h2>Mobile Test</h2>

        <div class="tg">
            <h3>1. Touch Detection</h3>
            <div class="tr">
                <button class="tb" onclick="testTouchSupport()">Touch Support</button>
                <button class="tb" onclick="testMaxTouch()">Max Touch Points</button>
                <button class="tb" onclick="testMobileUA()">Mobile UA</button>
                <span id="t1" class="r pending">pending</span>
            </div>
        </div>

        <div class="tg">
            <h3>2. Touch Controls Init</h3>
            <div class="tr">
                <button class="tb" onclick="testTCInit()">Init Controls</button>
                <button class="tb" onclick="testTCEnable()">Enable/Disable</button>
                <button class="tb" onclick="testTCUI()">UI Created</button>
                <span id="t2" class="r pending">pending</span>
            </div>
        </div>

        <div class="tg">
            <h3>3. Joystick</h3>
            <div class="tr">
                <button class="tb" onclick="testJoystickMove()">Move Simulate</button>
                <button class="tb" onclick="testJoystickReset()">Reset</button>
                <span id="t3" class="r pending">pending</span>
            </div>
        </div>

        <div class="tg">
            <h3>4. Look Controls</h3>
            <div class="tr">
                <button class="tb" onclick="testLookRotate()">Rotate Simulate</button>
                <button class="tb" onclick="testLookClamp()">Pitch Clamp</button>
                <span id="t4" class="r pending">pending</span>
            </div>
        </div>

        <div class="tg">
            <h3>5. Hotbar</h3>
            <div class="tr">
                <button class="tb" onclick="testHotbarSlots()">9 Slots</button>
                <button class="tb" onclick="testHotbarSelect()">Select Slot</button>
                <span id="t5" class="r pending">pending</span>
            </div>
        </div>

        <div class="tg">
            <h3>6. Responsive Layout</h3>
            <div class="tr">
                <button class="tb" onclick="testViewportWidth()">Viewport Width</button>
                <button class="tb" onclick="testFontSize()">Font Scaling</button>
                <button class="tb" onclick="testTouchTargets()">Touch Targets</button>
                <span id="t6" class="r pending">pending</span>
            </div>
        </div>

        <div class="tg">
            <h3>7. PWA</h3>
            <div class="tr">
                <button class="tb" onclick="testManifest()">Manifest</button>
                <button class="tb" onclick="testServiceWorker()">SW Registration</button>
                <button class="tb" onclick="testCache()">Cache API</button>
                <span id="t7" class="r pending">pending</span>
            </div>
        </div>

        <div class="tg">
            <h3>8. Performance</h3>
            <div class="tr">
                <button class="tb" onclick="testFPS()">FPS Check</button>
                <button class="tb" onclick="testDeviceMemory()">Device Memory</button>
                <button class="tb" onclick="testConcurrency()">CPU Cores</button>
                <span id="t8" class="r pending">pending</span>
            </div>
        </div>

        <div class="tg">
            <h3>9. Zoom Controls</h3>
            <div class="tr">
                <button class="tb" onclick="testZoomSim()">Pinch Zoom</button>
                <button class="tb" onclick="testFovClamp()">FOV Clamp</button>
                <span id="t9" class="r pending">pending</span>
            </div>
        </div>

        <div id="log"></div>
    </div>

    <script src="ui_connection.js"></script>
    <script src="touch_controls.js"></script>
    <script src="llm_client.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="voxel_renderer.js"></script>

    <script>
        let tc, renderer, engine;

        function log(msg, cls) {
            const div = document.createElement('div');
            div.className = cls || '';
            div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
            document.getElementById('log').appendChild(div);
            document.getElementById('log').scrollTop = document.getElementById('log').scrollHeight;
        }

        function setR(id, pass) {
            const el = document.getElementById(id);
            el.textContent = pass ? 'PASS' : 'FAIL';
            el.className = 'r ' + (pass ? 'pass' : 'fail');
        }

        async function init() {
            log('Loading...', 'info');
            engine = new EngineConnection();
            const ok = await engine.load();
            if (ok) { engine.initWorld(); log('WASM ready', 'ok'); }
            else log('WASM failed (test anyway)', 'err');

            renderer = new VoxelRenderer('viewport3d');
            renderer.start(engine);

            tc = new TouchControls();
            tc.init(engine, renderer);
            log('TouchControls initialized', 'ok');
        }

        // === TESTS ===

        function testTouchSupport() {
            const pass = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            setR('t1', pass);
            log('TouchSupport: ' + pass, pass ? 'ok' : 'info');
        }

        function testMaxTouch() {
            const pts = navigator.maxTouchPoints;
            setR('t1', true);
            log('MaxTouchPoints: ' + pts, 'ok');
        }

        function testMobileUA() {
            const ua = navigator.userAgent;
            const mobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
            setR('t1', true);
            log('MobileUA: ' + mobile + ' (' + ua.substring(0, 60) + '...)', 'ok');
        }

        function testTCInit() {
            const pass = tc instanceof TouchControls;
            setR('t2', pass);
            log('TCInit: ' + pass, pass ? 'ok' : 'err');
        }

        function testTCEnable() {
            tc.enable();
            const enabled = tc.enabled;
            tc.disable();
            const disabled = !tc.enabled;
            setR('t2', enabled && disabled);
            log('TCEnable/Disable: enable=' + enabled + ' disable=' + disabled, 'ok');
        }

        function testTCUI() {
            tc.enable();
            const joystick = document.getElementById('tc-joystick');
            const look = document.getElementById('tc-look');
            const actions = document.getElementById('tc-actions');
            const hotbar = document.getElementById('tc-hotbar');
            const pass = joystick && look && actions && hotbar;
            setR('t2', pass);
            log('TCUI: joystick=' + !!joystick + ' look=' + !!look + ' actions=' + !!actions + ' hotbar=' + !!hotbar, pass ? 'ok' : 'err');
            tc.disable();
        }

        function testJoystickMove() {
            tc._playerPos = { x: 0, y: 10, z: 0 };
            tc.joystick.x = 0.5;
            tc.joystick.y = 0.8;
            tc._update();
            const moved = tc._playerPos.x !== 0 || tc._playerPos.z !== 0;
            setR('t3', moved);
            log('JoystickMove: pos=' + JSON.stringify(tc._playerPos), moved ? 'ok' : 'err');
        }

        function testJoystickReset() {
            tc.joystick.x = 1;
            tc.joystick.y = 1;
            tc._endJoystick();
            const reset = tc.joystick.x === 0 && tc.joystick.y === 0;
            setR('t3', reset);
            log('JoystickReset: x=' + tc.joystick.x + ' y=' + tc.joystick.y, reset ? 'ok' : 'err');
        }

        function testLookRotate() {
            tc._playerYaw = 0;
            tc._playerPitch = 0;
            tc.lookSensitivity = 0.003;
            tc._playerYaw -= 100 * tc.lookSensitivity;
            tc._playerPitch -= 50 * tc.lookSensitivity;
            const pass = tc._playerYaw !== 0 && tc._playerPitch !== 0;
            setR('t4', pass);
            log('LookRotate: yaw=' + tc._playerYaw.toFixed(3) + ' pitch=' + tc._playerPitch.toFixed(3), pass ? 'ok' : 'err');
        }

        function testLookClamp() {
            tc._playerPitch = 999;
            tc._playerPitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, tc._playerPitch));
            const clamped = tc._playerPitch <= Math.PI / 2.2;
            setR('t4', clamped);
            log('LookClamp: pitch=' + tc._playerPitch.toFixed(3) + ' max=' + (Math.PI / 2.2).toFixed(3), clamped ? 'ok' : 'err');
        }

        function testHotbarSlots() {
            const hotbar = document.getElementById('tc-hotbar');
            const slots = hotbar ? hotbar.children.length : 0;
            const pass = slots === 9;
            setR('t5', pass);
            log('HotbarSlots: ' + slots, pass ? 'ok' : 'err');
        }

        function testHotbarSelect() {
            tc._selectSlot(3);
            const pass = tc.selectedSlot === 3;
            setR('t5', pass);
            log('HotbarSelect: slot=' + tc.selectedSlot, pass ? 'ok' : 'err');
        }

        function testViewportWidth() {
            const w = window.innerWidth;
            const pass = w > 0;
            setR('t6', pass);
            log('ViewportWidth: ' + w + 'px', pass ? 'ok' : 'info');
        }

        function testFontSize() {
            const body = getComputedStyle(document.body).fontSize;
            setR('t6', true);
            log('FontSize: ' + body, 'ok');
        }

        function testTouchTargets() {
            const buttons = document.querySelectorAll('.tb');
            let allPass = true;
            buttons.forEach(btn => {
                const rect = btn.getBoundingClientRect();
                if (rect.width < 40 || rect.height < 40) allPass = false;
            });
            setR('t6', allPass);
            log('TouchTargets: all >= 44px: ' + allPass, allPass ? 'ok' : 'info');
        }

        function testManifest() {
            const link = document.querySelector('link[rel="manifest"]');
            const pass = !!link;
            setR('t7', pass);
            log('Manifest: ' + (pass ? link.href : 'not found'), pass ? 'ok' : 'err');
        }

        function testServiceWorker() {
            const pass = 'serviceWorker' in navigator;
            setR('t7', pass);
            log('ServiceWorker API: ' + pass, pass ? 'ok' : 'info');
        }

        function testCache() {
            const pass = 'caches' in window;
            setR('t7', pass);
            log('CacheAPI: ' + pass, pass ? 'ok' : 'info');
        }

        function testFPS() {
            let frames = 0;
            const start = performance.now();
            function count() {
                frames++;
                if (performance.now() - start < 1000) {
                    requestAnimationFrame(count);
                } else {
                    const fps = frames;
                    const pass = fps > 0;
                    setR('t8', pass);
                    log('FPS: ~' + fps, fps >= 30 ? 'ok' : 'info');
                }
            }
            requestAnimationFrame(count);
        }

        function testDeviceMemory() {
            const mem = navigator.deviceMemory || 'unknown';
            setR('t8', true);
            log('DeviceMemory: ' + mem + 'GB', 'ok');
        }

        function testConcurrency() {
            const cores = navigator.hardwareConcurrency || 'unknown';
            setR('t8', true);
            log('CPUCore: ' + cores, 'ok');
        }

        function testZoomSim() {
            tc.zoom.active = true;
            tc.zoom.startDist = 200;
            tc.zoom.currentDist = 100;
            const scale = tc.zoom.startDist / tc.zoom.currentDist;
            const pass = scale === 2;
            setR('t9', pass);
            log('ZoomSim: scale=' + scale, pass ? 'ok' : 'err');
        }

        function testFovClamp() {
            const baseFov = 75;
            const scale = 0.5;
            let fov = baseFov * scale;
            fov = Math.max(30, Math.min(120, fov));
            const pass = fov >= 30 && fov <= 120;
            setR('t9', pass);
            log('FovClamp: fov=' + fov, pass ? 'ok' : 'err');
        }

        init();
    </script>
</body>
</html>
